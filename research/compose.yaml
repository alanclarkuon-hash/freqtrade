name: freqtrade-research
services:
  research:
    image: freqtradeorg/freqtrade:2026.9@sha256:989aff5636d8f0213ed44fe334c3314a194a51c0c755d16866960247aafd2eae
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    volumes:
      - research-data:/freqtrade/user_data
      - ./inputs:/research:ro
    command: ["--version"]
volumes:
  research-data:
